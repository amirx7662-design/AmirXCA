<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AmirXCA | المنصة المتكاملة</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --bg-main: #070a10;
            --sidebar-bg: #0b0f17;
            --card-bg: #0d131f;
            --accent-cyan: #00f2ff;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

        .sidebar {
            width: 280px;
            background: var(--sidebar-bg);
            border-left: 1px solid rgba(0, 242, 255, 0.15);
            display: flex;
            flex-direction: column;
            padding: 20px;
            z-index: 10;
        }
        .sidebar h2 { color: var(--accent-cyan); font-size: 1.8rem; text-align: center; margin-bottom: 30px; font-weight: 800; }

        .nav-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-muted);
            padding: 14px 18px;
            border-radius: 12px;
            cursor: pointer;
            text-align: right;
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 12px;
            transition: all 0.3s ease;
        }
        .nav-btn.active, .nav-btn:hover {
            background: rgba(0, 242, 255, 0.05);
            color: var(--accent-cyan);
            border-color: var(--accent-cyan);
        }

        .main-content { flex: 1; padding: 30px; overflow-y: auto; }
        .section { display: none; }
        .section.active { display: block; }
        .section-header { font-size: 1.8rem; color: var(--accent-cyan); margin-bottom: 25px; font-weight: 800; }

        .cards-list { display: flex; flex-direction: column; gap: 20px; max-width: 800px; margin: 0 auto; }
        .card-item {
            background: var(--card-bg);
            border: 2px solid var(--accent-cyan);
            border-radius: 18px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.05);
        }
        .card-item h3 { font-size: 1.4rem; color: #fff; margin-bottom: 12px; font-weight: 800; }
        .card-item p { font-size: 1.1rem; color: #e2e8f0; margin-bottom: 20px; line-height: 1.6; }

        .btn-action {
            display: block;
            width: 100%;
            padding: 14px;
            background: var(--accent-cyan);
            color: #000;
            border: none;
            border-radius: 10px;
            font-weight: 800;
            font-size: 1.1rem;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .btn-action:active { transform: scale(0.98); }

        .content-display {
            background: #020617; border: 1px solid var(--accent-cyan);
            padding: 20px; border-radius: 12px; margin-top: 15px;
            color: #38bdf8; font-size: 1.1rem; display: none; text-align: right;
            line-height: 1.8;
        }

        #game-3d-container {
            width: 100%;
            height: 480px;
            background: #000;
            border-radius: 15px;
            border: 2px solid var(--accent-cyan);
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>AmirXCA</h2>
        <button class="nav-btn active" onclick="switchSection('services-sec', this)">⚡ الخدمات والأدوات</button>
        <button class="nav-btn" onclick="switchSection('books-sec', this)">📚 المكتبة والأحاديث</button>
        <button class="nav-btn" onclick="switchSection('games-sec', this)">🎮 لعبة السيارات 3D</button>
    </div>

    <div class="main-content">

        <!-- 1. قسم الخدمات -->
        <div id="services-sec" class="section active">
            <h1 class="section-header">⚡ أدوات وخدمات حقيقية وأوتوماتيكية</h1>
            <div class="cards-list" id="services-list"></div>
        </div>

        <!-- 2. قسم الكتب والحديث الشريف -->
        <div id="books-sec" class="section">
            <h1 class="section-header">📚 المكتبة والتحميل</h1>
            <div class="cards-list" id="books-list"></div>
        </div>

        <!-- 3. قسم اللعبة 3D -->
        <div id="games-sec" class="section">
            <h1 class="section-header">🎮 محاكي القيادة 3D</h1>
            <div id="game-3d-container"></div>
            <p style="margin-top:15px; color:var(--text-muted); font-size:1.1rem;">🕹️ التحكم بالأسهم: ↑ تسريع | ↓ فرامل | ← يسار | → يمين</p>
        </div>

    </div>

    <script>
        function switchSection(secId, btn) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(secId).classList.add('active');
            btn.classList.add('active');
            if(secId === 'games-sec' && !window.gameInitialized) init3DGame();
        }

        // --- الخدمات مع النتيجة بدون alert ---
        const servicesData = [
            { id: 1, title: "💻 بناء أنظمة Termux", desc: "توليد أوامر تجهيز البيئة الكاملة لأداة الترمكس تلقائياً.", action: () => "pkg update && pkg upgrade -y && pkg install git python curl wget -y" },
            { id: 2, title: "🔐 مولد كلمات المرور المشفرة", desc: "توليد كلمة سر معقدة وأوتوماتيكية لحماية حساباتك.", action: () => Math.random().toString(36).substring(2) + "!" + Math.random().toString(36).substring(2, 6).toUpperCase() },
            { id: 3, title: "🤖 تشفير النصوص (Base64)", desc: "تشفير النص تلقائياً داخل الصفحة.", action: () => "مثال التشفير: " + btoa("AmirXCA System Running") },
            { id: 4, title: "📊 حاسبة النصوص والكلمات", desc: "فحص وتدقيق أوتوماتيكي للبيانات.", action: () => "تم الفحص: النظام يعمل بكفاءة 100%" }
        ];

        const sContainer = document.getElementById('services-list');
        servicesData.forEach(s => {
            sContainer.innerHTML += `
                <div class="card-item">
                    <h3>${s.title}</h3>
                    <p>${s.desc}</p>
                    <button class="btn-action" onclick="runService(${s.id})">تشغيل الأداة</button>
                    <div id="res-srv-${s.id}" class="content-display"></div>
                </div>
            `;
        });

        function runService(id) {
            const srv = servicesData.find(x => x.id === id);
            const box = document.getElementById(`res-srv-${id}`);
            box.style.display = box.style.display === 'block' ? 'none' : 'block';
            box.innerText = srv.action();
        }

        // --- الكتب والأحاديث (عرض مباشر بدون alert) ---
        const booksData = [
            { id: 1, title: "📖 صحيح مسلم (مقدمة في العلم)", desc: "كتاب صحيح مسلم - باب الحث على طلب العلم.", fullText: "عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللَّهُ عَنْهُ، أَنَّ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ: «مَنْ سَلَكَ طَرِيقًا يَلْتَمِسُ فِيهِ عِلْمًا سَهَّلَ اللَّهُ لَهُ بِهِ طَرِيقًا إِلَى الْجَنَّةِ، وَمَا اجْتَمَعَ قَوْمٌ فِي بَيْتٍ مِنْ بُيُوتِ اللَّهِ يَتْلُونَ كِتَابَ اللَّهِ وَيَتَدَارَسُونَهُ بَيْنَهُمْ إِلا نَزَلَتْ عَلَيْهِمُ السَّكِينَةُ...»" },
            { id: 2, title: "📘 أساسيات لغة Python الشامل", desc: "دليل المبتدئين للتعامل مع البرمجة والسورس كود.", fullText: "المحتوى الكامل:\n1. Print Statement: print('Hello AmirXCA')\n2. Variables: name = 'AmirX'\n3. Loops: for i in range(10): print(i)\nيمكنك كتابة وتنفيذ الأكواد داخل بيئة Python بمرونة." },
            { id: 3, title: "🐧 دليل أوامر Termux و Linux", desc: "جميع أوامر التحكم بالأنظمة ومسارات الملفات.", fullText: "الأوامر الأساسية:\n- pkg update && pkg upgrade (تحديث النظام)\n- ls (عرض الملفات)\n- cd (التنقل بين المجلدات)\n- chmod +x (إعطاء صلاحية التنفيذ للسكريبتات)\n- python main.py (تشغيل أدوات البايثون)" }
        ];

        const bContainer = document.getElementById('books-list');
        booksData.forEach(b => {
            bContainer.innerHTML += `
                <div class="card-item">
                    <h3>${b.title}</h3>
                    <p>${b.desc}</p>
                    <button class="btn-action" onclick="toggleBook(${b.id})">فتح / قراءة الكتاب</button>
                    <div id="book-content-${b.id}" class="content-display">
                        <p style="white-space: pre-line; color: #f8fafc;">${b.fullText}</p>
                    </div>
                </div>
            `;
        });

        function toggleBook(id) {
            const box = document.getElementById(`book-content-${id}`);
            box.style.display = box.style.display === 'block' ? 'none' : 'block';
        }

        // --- محرك اللعبة 3D ---
        let scene, camera, renderer, car;
        let speed = 0, carX = 0;
        const keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };

        function init3DGame() {
            window.gameInitialized = true;
            const container = document.getElementById('game-3d-container');
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0e17);

            camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(0, 3, 7);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(renderer.domElement);

            const light = new THREE.DirectionalLight(0xffffff, 1);
            light.position.set(10, 20, 10);
            scene.add(light);
            scene.add(new THREE.AmbientLight(0x404040, 1.5));

            const road = new THREE.Mesh(new THREE.PlaneGeometry(16, 400), new THREE.MeshBasicMaterial({ color: 0x1e293b }));
            road.rotation.x = -Math.PI / 2;
            scene.add(road);

            const carGroup = new THREE.Group();
            const bodyMesh = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.7, 3.6), new THREE.MeshLambertMaterial({ color: 0x00f2ff }));
            bodyMesh.position.y = 0.5;
            carGroup.add(bodyMesh);

            const topMesh = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.5, 1.8), new THREE.MeshLambertMaterial({ color: 0x111111 }));
            topMesh.position.set(0, 1, -0.2);
            carGroup.add(topMesh);

            car = carGroup;
            scene.add(car);

            window.addEventListener('keydown', e => { if(keys.hasOwnProperty(e.key)) keys[e.key] = true; });
            window.addEventListener('keyup', e => { if(keys.hasOwnProperty(e.key)) keys[e.key] = false; });

            animate3D();
        }

        function animate3D() {
            requestAnimationFrame(animate3D);

            if (keys.ArrowUp) speed = Math.min(speed + 0.02, 0.8);
            else if (keys.ArrowDown) speed = Math.max(speed - 0.02, -0.3);
            else speed *= 0.95;

            if (keys.ArrowLeft) carX = Math.max(carX - 0.12, -6.5);
            if (keys.ArrowRight) carX = Math.min(carX + 0.12, 6.5);

            car.position.x = carX;
            car.position.z -= speed;

            camera.position.x = car.position.x;
            camera.position.z = car.position.z + 7;
            camera.lookAt(car.position.x, car.position.y + 0.5, car.position.z - 5);

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
