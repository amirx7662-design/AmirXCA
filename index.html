<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AmirXCA | المنصة الشاملة</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --bg-main: #070a10;
            --sidebar-bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.8);
            --accent-cyan: #00f2ff;
            --accent-green: #10b981;
            --accent-purple: #a855f7;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

        .sidebar {
            width: 260px;
            background: var(--sidebar-bg);
            border-left: 1px solid rgba(0, 242, 255, 0.2);
            display: flex;
            flex-direction: column;
            padding: 20px;
            z-index: 10;
        }
        .sidebar h2 { color: var(--accent-cyan); font-size: 1.6rem; text-align: center; margin-bottom: 25px; }

        .nav-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-muted);
            padding: 12px 16px;
            border-radius: 10px;
            cursor: pointer;
            text-align: right;
            font-size: 0.95rem;
            font-weight: 700;
            margin-bottom: 8px;
            transition: all 0.3s;
        }
        .nav-btn.active, .nav-btn:hover {
            background: rgba(0, 242, 255, 0.1);
            color: var(--accent-cyan);
            border-color: var(--accent-cyan);
        }

        .main-content { flex: 1; padding: 25px; overflow-y: auto; }
        .section { display: none; }
        .section.active { display: block; }
        .section-header { font-size: 1.6rem; color: var(--accent-cyan); margin-bottom: 20px; border-bottom: 2px solid rgba(0, 242, 255, 0.2); padding-bottom: 8px; }

        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 15px; }
        .card {
            background: var(--card-bg);
            border: 1px solid rgba(0, 242, 255, 0.2);
            border-radius: 12px;
            padding: 16px;
        }
        .card h3 { font-size: 1.1rem; color: #fff; margin-bottom: 8px; }
        .card p { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 12px; line-height: 1.4; }

        .btn {
            display: block; width: 100%; padding: 10px;
            background: var(--accent-cyan); color: #000;
            border: none; border-radius: 8px; font-weight: 800;
            cursor: pointer; text-align: center; text-decoration: none;
            font-size: 0.9rem;
        }
        .btn:hover { opacity: 0.9; }
        .btn-green { background: var(--accent-green); color: #fff; }

        .res-box {
            background: #020617; border: 1px dashed var(--accent-cyan);
            padding: 10px; border-radius: 6px; margin-top: 10px;
            font-family: monospace; color: #4ade80; font-size: 0.85rem;
            display: none; word-break: break-all; white-space: pre-wrap;
        }

        #game-3d-container {
            width: 100%;
            height: 420px;
            background: #000;
            border-radius: 12px;
            border: 2px solid var(--accent-cyan);
            position: relative;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>AmirXCA</h2>
        <button class="nav-btn active" onclick="switchSection('games-sec', this)">🎮 لعبة السيارات 3D</button>
        <button class="nav-btn" onclick="switchSection('services-sec', this)">⚡ الخدمات والأدوات (10)</button>
        <button class="nav-btn" onclick="switchSection('books-sec', this)">📚 المكتبة الإسلامية والبرمجية</button>
    </div>

    <div class="main-content">

        <!-- 1. قسم اللعبة 3D -->
        <div id="games-sec" class="section active">
            <h1 class="section-header">🎮 محاكي القيادة 3D</h1>
            <div id="game-3d-container"></div>
            <p style="margin-top:10px; color:var(--text-muted);">🕹️ التحكم بالأسهم: ↑ للسرعة | ↓ للفرامل | ← يسار | → يمين</p>
        </div>

        <!-- 2. قسم الخدمات (10 أدوات أوتوماتيكية) -->
        <div id="services-sec" class="section">
            <h1 class="section-header">⚡ أدوات وخدمات رقمية حقيقية</h1>
            <div class="grid" id="services-grid"></div>
        </div>

        <!-- 3. قسم الكتب -->
        <div id="books-sec" class="section">
            <h1 class="section-header">📚 المكتبة والأحاديث الشريفة</h1>
            <div class="grid" id="books-grid"></div>
        </div>

    </div>

    <script>
        function switchSection(secId, btn) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(secId).classList.add('active');
            btn.classList.add('active');
            if(secId === 'games-sec' && !window.gameInitialized) init3DGame();
        }

        // --- قائمة الخدمات الحقيقية (10) ---
        const servicesData = [
            { id: 1, title: "🔑 مولد كلمة مرور آمنة", desc: "توليد كلمة مرور معقدة وعشوائية أوتوماتيكياً.", action: () => Math.random().toString(36).substring(2) + "!A9#" },
            { id: 2, title: "🔒 تشفير Base64", desc: "تحويل النص إلى كود تشفير Base64.", action: () => { let t = prompt("أدخل النص لتشفيره:"); return t ? btoa(t) : "لم يتم إدخال نص"; } },
            { id: 3, title: "🔓 فك تشفير Base64", desc: "فك شفرة نصوص Base64 إلى نص عادي.", action: () => { let t = prompt("أدخل النص المشفر:"); try { return atob(t); } catch(e) { return "شفرة غير صالحة"; } } },
            { id: 4, title: "📝 عداد الحروف والكلمات", desc: "حساب عدد الحروف والكلمات في النص.", action: () => { let t = prompt("أدخل النص لحسابه:"); return t ? `الحروف: ${t.length} | الكلمات: ${t.trim().split(/\s+/).length}` : "لم يتم إدخال نص"; } },
            { id: 5, title: "⚡ سكريبت تحديث Termux", desc: "توليد كود التحديث الشامل للترمكس.", action: () => "pkg update && pkg upgrade -y && pkg install git python -y" },
            { id: 6, title: "🔤 تحويل النص لحروف كبيرة (UPPER)", desc: "تحويل النصوص الإنجليزية للنمط الكبير.", action: () => { let t = prompt("أدخل النص:"); return t ? t.toUpperCase() : "خطأ"; } },
            { id: 7, title: "🎲 مولد أرقام عشوائية", desc: "إنشاء رقم عشوائي بين 1 و 10000.", action: () => Math.floor(Math.random() * 10000) + 1 },
            { id: 8, title: "🌐 فحص بروتوكول الرابط", desc: "تحليل هل الرابط آمن (HTTPS) أم لا.", action: () => { let u = prompt("أدخل الرابط:"); return u ? (u.startsWith("https") ? "✅ رابط آمن HTTPS" : "⚠️ رابط غير مشفر HTTP") : "لم يتم إدخال رابط"; } },
            { id: 9, title: "🕒 الوقت والتاريخ الحالي", desc: "عرض الوقت الدقيق والسيرفر المحلي.", action: () => new Date().toLocaleString("ar-SA") },
            { id: 10, title: "🧹 نظافة النصوص (Strip Spaces)", desc: "إزالة المسافات الزائدة والتنسيق.", action: () => { let t = prompt("أدخل النص:"); return t ? t.replace(/\s+/g, ' ').trim() : "خطأ"; } }
        ];

        const sGrid = document.getElementById('services-grid');
        servicesData.forEach(s => {
            sGrid.innerHTML += `
                <div class="card">
                    <h3>${s.title}</h3>
                    <p>${s.desc}</p>
                    <button class="btn" onclick="runSrv(${s.id})">تشغيل الأداة 🚀</button>
                    <div id="res-srv-${s.id}" class="res-box"></div>
                </div>
            `;
        });

        function runSrv(id) {
            const srv = servicesData.find(x => x.id === id);
            const res = srv.action();
            const box = document.getElementById(`res-srv-${id}`);
            box.style.display = 'block';
            box.innerText = "النتيجة:\n" + res;
        }

        // --- قائمة الكتب وصحيح مسلم ---
        const booksData = [
            { title: "📖 صحيح مسلم (مقدمة في العلم)", content: "قال رسول الله ﷺ: «مَنْ سَلَكَ طَرِيقًا يَلْتَمِسُ فِيهِ عِلْمًا سَهَّلَ اللَّهُ لَهُ بِهِ طَرِيقًا إِلَى الْجَنَّةِ»." },
            { title: "📘 أساسيات لغة Python", content: "تعلم المتغيرات (Variables)، الدوال (Functions)، والـ Loops لبناء أدواتك وتطبيقاتك الذكية." },
            { title: "🐧 دليل أوامر Termux و Linux", content: "أهم الأوامر: ls لفتح الملفات، cd للتنقل، chmod +x لمنح صلاحية التنفيذ، وgit clone لسحب المشاريع." },
            { title: "🛡️ مبادئ أمن المعلومات", content: "تأمين الحسابات يعتمد على استخدام التحقق بخطوتين (2FA) وتوليد كلمات مرور قوية لا تقل عن 12 رمزاً." },
            { title: "🌐 أساسيات الشبكات والـ IP", content: "فهم بروتوكولات الإنترنت (TCP/IP) وكيفية تحويل العناوين الرقمية عبر خوادم DNS." }
        ];

        const bGrid = document.getElementById('books-grid');
        booksData.forEach(b => {
            bGrid.innerHTML += `
                <div class="card">
                    <h3>${b.title}</h3>
                    <p style="color:#e2e8f0;">${b.content}</p>
                </div>
            `;
        });

        // --- محرك اللعبة 3D ---
        let scene, camera, renderer, car;
        let speed = 0, carX = 0;
        const keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };

        function init3DGame() {
            window.gameInitialized = true;
            const container = document.getElementById('game-3d-container');
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0e17);

            camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(0, 3, 7);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(renderer.domElement);

            const light = new THREE.DirectionalLight(0xffffff, 1);
            light.position.set(10, 20, 10);
            scene.add(light);
            scene.add(new THREE.AmbientLight(0x404040, 1.5));

            // الطريق
            const road = new THREE.Mesh(new THREE.PlaneGeometry(16, 400), new THREE.MeshBasicMaterial({ color: 0x1e293b }));
            road.rotation.x = -Math.PI / 2;
            scene.add(road);

            // السيارة
            const carGroup = new THREE.Group();
            const bodyMesh = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.7, 3.6), new THREE.MeshLambertMaterial({ color: 0x00f2ff }));
            bodyMesh.position.y = 0.5;
            carGroup.add(bodyMesh);

            const topMesh = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.5, 1.8), new THREE.MeshLambertMaterial({ color: 0x111111 }));
            topMesh.position.set(0, 1, -0.2);
            carGroup.add(topMesh);

            car = carGroup;
            scene.add(car);

            window.addEventListener('keydown', e => { if(keys.hasOwnProperty(e.key)) keys[e.key] = true; });
            window.addEventListener('keyup', e => { if(keys.hasOwnProperty(e.key)) keys[e.key] = false; });

            animate3D();
        }

        function animate3D() {
            requestAnimationFrame(animate3D);

            if (keys.ArrowUp) speed = Math.min(speed + 0.02, 0.8);
            else if (keys.ArrowDown) speed = Math.max(speed - 0.02, -0.3);
            else speed *= 0.95;

            if (keys.ArrowLeft) carX = Math.max(carX - 0.12, -6.5);
            if (keys.ArrowRight) carX = Math.min(carX + 0.12, 6.5);

            car.position.x = carX;
            car.position.z -= speed;

            camera.position.x = car.position.x;
            camera.position.z = car.position.z + 7;
            camera.lookAt(car.position.x, car.position.y + 0.5, car.position.z - 5);

            renderer.render(scene, camera);
        }

        window.onload = init3DGame;
    </script>
</body>
</html>
