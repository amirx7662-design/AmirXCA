<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>AmirXCA | Enterprise OS</title>
    <style>
        body { background: #050505; color: #00ff41; font-family: 'Courier New', Courier, monospace; margin: 0; overflow: hidden; }
        #desktop { width: 100vw; height: 100vh; display: flex; flex-direction: column; }
        
        /* Terminal */
        #term-container { flex: 1; padding: 20px; overflow-y: auto; background: #000; border-bottom: 2px solid #333; }
        #output { white-space: pre-wrap; }
        #input-line { display: flex; }
        #prompt { color: #00ff41; margin-right: 10px; }
        #cmd-input { background: none; border: none; color: #fff; flex: 1; outline: none; font-family: inherit; }

        /* Nano Editor UI */
        #nano-editor { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 100; flex-direction: column; }
        .nano-header { background: #fff; color: #000; padding: 5px; font-weight: bold; }
        .nano-body { flex: 1; padding: 20px; outline: none; white-space: pre; color: #ccc; }
        .nano-footer { background: #333; color: #fff; padding: 5px; font-size: 12px; }

        /* Control Panel */
        #control-panel { display: none; position: fixed; top: 20%; left: 20%; width: 60%; height: 60%; background: #111; border: 1px solid #00ff41; z-index: 50; padding: 20px; }
    </style>
</head>
<body>

    <div id="desktop">
        <div id="term-container">
            <div id="output">AmirXCA Enterprise OS v1.0.0
اكتب 'help' لعرض الأوامر المتاحة.
</div>
            <div id="input-line">
                <span id="prompt">amirx@system:~$</span>
                <input type="text" id="cmd-input" autofocus>
            </div>
        </div>
    </div>

    <!-- Nano Editor Simulation -->
    <div id="nano-editor">
        <div class="nano-header"> GNU nano 9.2 &nbsp;&nbsp;&nbsp;&nbsp; File: <span id="file-name">index.html</span></div>
        <textarea id="nano-body" class="nano-body" spellcheck="false"></textarea>
        <div class="nano-footer">
            ^G Help  ^O Write Out  ^X Exit  ^K Cut
        </div>
    </div>

    <script>
        const input = document.getElementById('cmd-input');
        const output = document.getElementById('output');
        const nano = document.getElementById('nano-editor');

        input.addEventListener('keydown', function(e) {
            if(e.key === 'Enter') {
                const cmd = input.value.trim();
                output.innerHTML += `\n${document.getElementById('prompt').innerText} ${cmd}\n`;
                processCommand(cmd);
                input.value = '';
                document.getElementById('term-container').scrollTop = document.getElementById('term-container').scrollHeight;
            }
        });

        function processCommand(cmd) {
            if(cmd === 'help') output.innerHTML += 'أوامر متاحة: help, ls, clear, nano [file], control-panel\n';
            else if(cmd === 'ls') output.innerHTML += 'index.html    README.md    assets/    config.sys\n';
            else if(cmd === 'clear') output.innerHTML = '';
            else if(cmd.startsWith('nano')) {
                const filename = cmd.split(' ')[1] || 'newfile.txt';
                document.getElementById('file-name').innerText = filename;
                nano.style.display = 'flex';
            }
            else if(cmd === 'control-panel') {
                alert('جارٍ فتح لوحة التحكم...');
            }
            else output.innerHTML += `bash: ${cmd}: command not found\n`;
        }

        // Nano Exit (CTRL+X)
        document.addEventListener('keydown', (e) => {
            if(e.ctrlKey && e.key === 'x') {
                nano.style.display = 'none';
                output.innerHTML += '[System] تم حفظ الملف والخروج من Nano.\n';
            }
        });
    </script>
</body>
</html>
