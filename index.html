<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>Cyber Terminal v1.0</title>
    <style>
        body { background: #000; color: #0f0; font-family: monospace; margin: 0; padding: 20px; }
        .xp-badge { border: 1px solid #0f0; padding: 5px; width: fit-content; margin-bottom: 20px; }
        #chat-box { position: fixed; bottom: 20px; right: 20px; width: 250px; height: 200px; background: #111; border: 1px solid #0f0; display: none; padding: 10px; }
        #chat-history { height: 140px; overflow-y: auto; font-size: 12px; margin-bottom: 10px; }
        input { width: 100%; background: #000; color: #0f0; border: 1px solid #0f0; }
        button { background: #0f0; color: #000; border: none; cursor: pointer; padding: 5px; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="xp-badge">الرتبة: <span id="rank">Novice</span> | XP: <span id="xp-val">0</span></div>

    <h1>Cyber Dashboard</h1>
    <button onclick="playClick()">لعبة الثعبان</button>
    <button onclick="playClick()">فحص المنافذ</button>

    <div id="chat-box">
        <div id="chat-history"></div>
        <input type="text" id="chat-input" placeholder="اكتب للـ AI...">
    </div>
    <button onclick="toggleChat()">Chat System</button>

    <script>
        // XP System
        let xp = parseInt(localStorage.getItem('user_xp')) || 0;
        document.getElementById('xp-val').innerText = xp;
        
        function addXP(amount) {
            xp += amount;
            localStorage.setItem('user_xp', xp);
            document.getElementById('xp-val').innerText = xp;
        }

        // Sound System (بيبة بسيطة بدون ملفات خارجية)
        function playClick() {
            let audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            let oscillator = audioCtx.createOscillator();
            oscillator.connect(audioCtx.destination);
            oscillator.frequency.value = 440;
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.1);
            addXP(5);
        }

        // Chat System
        function toggleChat() {
            let box = document.getElementById('chat-box');
            box.style.display = (box.style.display === 'none') ? 'block' : 'none';
        }

        document.getElementById('chat-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                document.getElementById('chat-history').innerHTML += '<p>> ' + this.value + '</p>';
                document.getElementById('chat-history').innerHTML += '<p style="color:#00f">System: تم التنفيذ...</p>';
                this.value = '';
                addXP(20);
            }
        });
    </script>
</body>
</html>
