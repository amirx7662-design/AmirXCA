<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>AmirXCA | النظام المشحون</title>
    <style>
        :root { --bg: #070a10; --primary: #00f2ff; --card: #161f30; --text: #f3f4f6; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; display: flex; margin: 0; }
        .sidebar { width: 250px; background: #080b12; height: 100vh; padding: 20px; border-left: 1px solid #333; position: fixed; }
        .main { margin-right: 250px; padding: 30px; width: 100%; }
        .card { background: var(--card); padding: 20px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #333; }
        .btn { background: var(--primary); border: none; padding: 12px; border-radius: 5px; cursor: pointer; font-weight: bold; margin: 5px; color: #000; }
        .res-box { background: #000; color: #0f0; padding: 15px; margin-top: 10px; border: 1px solid #444; white-space: pre-wrap; font-family: monospace; }
        textarea { width: 100%; height: 80px; background: #111; color: #fff; padding: 10px; border: 1px solid #444; }
    </style>
</head>
<body>

<div class="sidebar">
    <h2 style="color:var(--primary)">AmirXCA</h2>
    <button class="btn" style="width:100%" onclick="show('books')">📚 المكتبة (محتوى كامل)</button><br><br>
    <button class="btn" style="width:100%" onclick="show('services')">⚡ الخدمات (أدوات عملية)</button>
</div>

<div class="main">
    <!-- قسم الكتب -->
    <div id="books" class="page">
        <h2>📚 المكتبة الإسلامية والبرمجية</h2>
        <div id="books-container"></div>
    </div>

    <!-- قسم الخدمات -->
    <div id="services" class="page" style="display:none;">
        <h2>⚡ خدمات حقيقية</h2>
        <div id="services-container"></div>
    </div>
</div>

<script>
    // --- 5 كتب بمحتواها الكامل ---
    const books = [
        { title: "صحيح مسلم: مقدمة في العلم", content: "قال رسول الله ﷺ: «من سلك طريقاً يلتمس فيه علماً سهل الله له به طريقاً إلى الجنة». هذا الكتاب يضع أصول طلب العلم والصدق." },
        { title: "تعلم بايثون (أساسيات)", content: "1. المتغيرات: x = 10 \n2. الطباعة: print('Hello') \n3. بايثون هي الأسهل لبناء أدوات برمجية." },
        { title: "دليل أوامر Termux", content: "ls: عرض الملفات | cd: تغيير المسار | pkg update: تحديث الحزم | chmod +x: منح صلاحيات التنفيذ." },
        { title: "أمن المعلومات (مبادئ)", content: "الهدف: حماية بياناتك. القاعدة 1: لا تفتح أي رابط مجهول. القاعدة 2: استخدم كلمات مرور طويلة (أكثر من 12 رمز)." },
        { title: "شبكات الحاسوب", content: "الشبكة هي مجموعة أجهزة مرتبطة. الـ IP هو عنوانك الرقمي، والـ Gateway هو بوابتك للخروج للإنترنت." }
    ];

    // --- 5 خدمات برمجية تعمل فوراً ---
    const services = [
        { name: "مولد باسورد (قوي)", func: "() => alert(Math.random().toString(36).substring(2,16))" },
        { name: "تشفير نص Base64", func: "() => { let t = prompt('نص للتشفير:'); alert(btoa(t)); }" },
        { name: "فك تشفير Base64", func: "() => { let t = prompt('نص للفك:'); alert(atob(t)); }" },
        { name: "عداد طول النص", func: "() => { let t = prompt('أدخل نصاً:'); alert('طول النص: ' + t.length); }" },
        { name: "توليد كود Termux للتثبيت", func: "() => alert('pkg update && pkg install git python -y')" }
    ];

    // --- عرض المحتوى ---
    let bCont = document.getElementById('books-container');
    books.forEach(b => {
        bCont.innerHTML += `<div class="card"><h3>${b.title}</h3><p>${b.content}</p></div>`;
    });

    let sCont = document.getElementById('services-container');
    services.forEach(s => {
        sCont.innerHTML += `<div class="card"><h3>${s.name}</h3><button class="btn" onclick="${s.func}">تنفيذ</button></div>`;
    });

    function show(id) {
        document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
        document.getElementById(id).style.display = 'block';
    }
</script>
</body>
</html>
