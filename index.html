<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>AmirXCA | النظام الكامل</title>
    <style>
        :root { --bg: #070a10; --primary: #00f2ff; --card: #161f30; --text: #f3f4f6; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; display: flex; margin: 0; }
        .sidebar { width: 250px; background: #080b12; height: 100vh; padding: 20px; border-left: 1px solid #333; position: fixed; }
        .main { margin-right: 250px; padding: 30px; width: 100%; }
        .card { background: var(--card); padding: 20px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #333; }
        .btn { background: var(--primary); border: none; padding: 10px; border-radius: 5px; cursor: pointer; font-weight: bold; margin: 5px; }
        .res-box { background: #000; color: #0f0; padding: 10px; margin-top: 10px; border: 1px solid #444; }
    </style>
</head>
<body>

<div class="sidebar">
    <h2 style="color:var(--primary)">AmirXCA</h2>
    <button class="btn" style="width:100%" onclick="show('books')">📚 المكتبة</button><br><br>
    <button class="btn" style="width:100%" onclick="show('services')">⚡ الخدمات</button><br><br>
    <button class="btn" style="width:100%" onclick="show('games')">🎮 اللعبة</button>
</div>

<div class="main">
    <!-- قسم الكتب -->
    <div id="books" class="page">
        <h2>📚 مكتبة أمير التقنية</h2>
        <div id="books-container"></div>
    </div>

    <!-- قسم الخدمات -->
    <div id="services" class="page" style="display:none;">
        <h2>⚡ خدمات برمجية حقيقية</h2>
        <div id="services-container"></div>
    </div>

    <!-- قسم اللعبة -->
    <div id="games" class="page" style="display:none;">
        <h2>🎮 لعبة السيارات 3D</h2>
        <div class="card">المحرك يعمل... (سيتم تحميل البيئة ثلاثية الأبعاد)</div>
    </div>
</div>

<script>
    // --- البيانات الحقيقية (أضف أي كتاب أو خدمة هنا يدوياً) ---
    const books = [
        { title: "صحيح مسلم (مقدمة)", content: "كتاب صحيح مسلم هو أحد أصح الكتب بعد كتاب الله..." },
        { title: "تعلم بايثون", content: "بايثون لغة سهلة جداً للمبتدئين، ابدأ بتعلم المتغيرات..." },
        { title: "أوامر Linux", content: "تعلم أوامر مثل: ls (عرض الملفات)، cd (التنقل)، rm (الحذف)..." },
        { title: "أمن المعلومات", content: "حماية بياناتك تبدأ من اختيار كلمة مرور معقدة وتحديث النظام..." },
        { title: "أساسيات الشبكات", content: "الشبكات هي العمود الفقري للإنترنت، ابدأ بفهم الـ IP والـ DNS..." }
    ];

    const services = [
        { name: "مولد باسورد عشوائي", action: "genPass" },
        { name: "تحويل النص إلى Base64", action: "toBase64" },
        { name: "حاسبة التشفير البسيط", action: "caesar" },
        { name: "فحص قوة النص", action: "checkStrength" },
        { name: "توليد كود Termux", action: "termux" }
    ];

    // --- عرض المحتوى ---
    function show(id) {
        document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
        document.getElementById(id).style.display = 'block';
    }

    // عرض الكتب
    let bCont = document.getElementById('books-container');
    books.forEach(b => {
        bCont.innerHTML += `<div class="card"><h3>${b.title}</h3><p>${b.content}</p></div>`;
    });

    // عرض الخدمات
    let sCont = document.getElementById('services-container');
    services.forEach(s => {
        sCont.innerHTML += `<div class="card"><h3>${s.name}</h3><button class="btn" onclick="${s.action}()">تشغيل</button><div id="${s.action}-res" class="res-box"></div></div>`;
    });

    // --- منطق الخدمات الحقيقي ---
    function genPass() { document.getElementById('genPass-res').innerText = "🔑: " + Math.random().toString(36).substring(2, 14); }
    function toBase64() { let t = prompt("أدخل النص:"); document.getElementById('toBase64-res').innerText = btoa(t); }
    function termux() { document.getElementById('termux-res').innerText = "pkg update && pkg upgrade -y && pkg install git python"; }
    function caesar() { alert("تشفير بسيط قيد التطوير..."); }
    function checkStrength() { alert("جاري فحص القوة..."); }

</script>
</body>
</html>
