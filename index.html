<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AmirXCA | System</title>
    <style>
        :root { --accent: #00f2ff; --bg: #05080e; }
        body { background: var(--bg); color: #fff; font-family: sans-serif; margin: 0; }
        header { padding: 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
        .logo-title { color: var(--accent); font-weight: bold; font-size: 1.5rem; cursor: pointer; }
        .section { display: none; padding: 20px; }
        .section.active { display: block; }
        .card { background: #111; padding: 15px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #222; }
        .btn { background: var(--accent); color: #000; border: none; padding: 10px; cursor: pointer; border-radius: 4px; }
    </style>
</head>
<body>

<header>
    <!-- عند الضغط مرتين يطلب الباسورد -->
    <div class="logo-title" ondblclick="accessSecretPanel()">AmirXCA</div>
    <nav>
        <button onclick="showSection('home')">الرئيسية</button>
        <button onclick="showSection('books')">الكتب</button>
        <button onclick="showSection('sadaqah')">أجر جاري</button>
    </nav>
</header>

<!-- القسم الرئيسي -->
<div id="sec-home" class="section active">
    <h1>أهلاً بك في النظام</h1>
    <p>النظام يعمل بكفاءة.</p>
</div>

<!-- قسم الكتب -->
<div id="sec-books" class="section">
    <h2>المكتبة الرقمية</h2>
    <div class="card">
        <h3>صحيح مسلم</h3>
        <p>تحميل كتاب صحيح مسلم بصيغة PDF.</p>
        <a href="https://archive.org/details/Sahih-Muslim" target="_blank"><button class="btn">تحميل الآن</button></a>
    </div>
</div>

<!-- قسم الأجر الجاري -->
<div id="sec-sadaqah" class="section">
    <h2>أجر جاري (صدقة جارية)</h2>
    <div class="card">
        <h3>القرآن الكريم</h3>
        <p>استمع واقرأ القرآن الكريم صدقة عنك وعن المسلمين.</p>
        <a href="https://quran.com" target="_blank"><button class="btn">زيارة الموقع</button></a>
    </div>
</div>

<!-- لوحة التحكم السرية (مخفية) -->
<div id="sec-admin" class="section" style="border: 2px solid red;">
    <h2>🔒 لوحة التحكم السرية (AmirXX)</h2>
    <div class="card">
        <h3>إعدادات النظام المتقدمة</h3>
        <p>تم الدخول بنجاح.</p>
    </div>
</div>

<script>
    // التنقل بين الأقسام
    function showSection(id) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.getElementById('sec-' + id).classList.add('active');
    }

    // الدخول للوحة السرية
    function accessSecretPanel() {
        let pass = prompt("أدخل رمز الوصول السري:");
        if (pass === "AmirXX") {
            showSection('admin');
            alert("تم فتح لوحة التحكم السرية بنجاح.");
        } else {
            alert("رمز خاطئ!");
        }
    }
</script>

</body>
</html>
