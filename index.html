<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AmirXCA - الإصدار المتقدم</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --neon: #00f2ff; --bg: #050505; --card: #111; }
        body { background: var(--bg); color: #fff; font-family: 'Cairo', sans-serif; margin: 0; padding: 20px; }
        
        /* تصميم فخم وجديد */
        .hero { text-align: center; padding: 60px 20px; background: linear-gradient(to bottom, #111, #050505); border-bottom: 2px solid var(--neon); }
        .hero h1 { font-size: 3.5rem; color: var(--neon); text-shadow: 0 0 20px var(--neon); margin: 0; }
        
        .section { max-width: 1000px; margin: 40px auto; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        
        .card { background: var(--card); border: 1px solid #333; padding: 30px; border-radius: 20px; transition: 0.3s; border-left: 5px solid var(--neon); }
        .card:hover { transform: scale(1.02); box-shadow: 0 0 15px rgba(0, 242, 255, 0.2); }
        
        .btn { width: 100%; padding: 15px; background: var(--neon); color: #000; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        
        /* شات ذكي */
        #ai-box { position: fixed; bottom: 20px; right: 20px; width: 350px; background: #000; border: 1px solid var(--neon); border-radius: 20px; display: none; overflow: hidden; z-index: 999; }
        .chat-area { height: 300px; overflow-y: auto; padding: 15px; }
        .chat-input { padding: 10px; display: flex; }
    </style>
</head>
<body>

    <div class="hero">
        <h1>AmirXCA</h1>
        <p>المنصة المفتوحة للحلول البرمجية الذكية</p>
    </div>

    <div class="section">
        <div class="grid">
            <div class="card">
                <h3>💻 بناء أنظمة Termux</h3>
                <p>اصنع بيئتك الخاصة مجاناً</p>
                <button class="btn">ابدأ الآن</button>
            </div>
            <div class="card">
                <h3>🎮 استضافة خوادم</h3>
                <p>سيرفرات ألعاب مجانية للكل</p>
                <button class="btn">ابدأ الآن</button>
            </div>
            <div class="card">
                <h3>🤖 أتمتة البايثون</h3>
                <p>سكريبتات احترافية متاحة للجميع</p>
                <button class="btn">ابدأ الآن</button>
            </div>
        </div>
    </div>

    <button onclick="document.getElementById('ai-box').style.display='block'" style="position:fixed; bottom:20px; right:20px; padding:15px; background:var(--neon); border-radius:50px; border:none; cursor:pointer;">🤖 Gemini AI</button>

    <div id="ai-box">
        <div style="background:var(--neon); padding:10px; text-align:center; font-weight:bold; color:#000;">AmirX AI</div>
        <div class="chat-area" id="chat"></div>
        <div class="chat-input">
            <input type="text" id="msg" style="flex:1; background:#222; color:#fff; border:none; padding:10px;">
            <button onclick="askAI()">إرسال</button>
        </div>
    </div>

    <script>
        const API_KEY = "AQ.Ab8RN6LMVcispAym35R-ZAcZuEIT7MpAsQCdnoDYlZY_l9r3jw";
        async function askAI() {
            let input = document.getElementById('msg');
            let chat = document.getElementById('chat');
            let text = input.value;
            chat.innerHTML += `<p><b>أنت:</b> ${text}</p>`;
            input.value = '';

            try {
                let res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: text }] }] })
                });
                let data = await res.json();
                let reply = data.candidates[0].content.parts[0].text;
                chat.innerHTML += `<p style="color:var(--neon)"><b>AI:</b> ${reply}</p>`;
            } catch (e) {
                chat.innerHTML += `<p style="color:red">خطأ في الاتصال بالسيرفر. تأكد من المفتاح.</p>`;
            }
        }
    </script>
</body>
</html>
