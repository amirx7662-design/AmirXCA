<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>AmirXCA | المنصة التقنية</title>
    <style>
        body { background: #0b0f17; color: #fff; font-family: sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; }
        h2 { color: #00f2ff; border-bottom: 2px solid #00f2ff; padding-bottom: 10px; }
        .card { background: #161f30; padding: 15px; border-radius: 10px; margin: 10px 0; border: 1px solid #333; }
        button { background: #00f2ff; border: none; padding: 10px; cursor: pointer; font-weight: bold; border-radius: 5px; }
        #gameCanvas { background: #111; border: 2px solid #fff; display: block; margin: 20px auto; }
    </style>
</head>
<body>

<div class="container">
    <h1>موقع AmirXCA</h1>

    <!-- 1. لعبة السيارات 3D -->
    <h2>🎮 لعبة سباق السيارات (برمجية)</h2>
    <div class="card">
        <canvas id="gameCanvas" width="300" height="400"></canvas>
        <p style="text-align:center">تحكم بالأسهم: سهم يمين ويسار</p>
    </div>

    <!-- 2. الخدمات -->
    <h2>⚡ الخدمات الأساسية</h2>
    <div class="card">
        <button onclick="genPass()">توليد كلمة مرور قوية</button>
        <button onclick="cleanCode()">تنظيف كود HTML</button>
        <button onclick="checkURL()">فحص رابط</button>
        <div id="service-out" style="margin-top:10px; color:#0f0;"></div>
    </div>

    <!-- 3. الكتب (صحيح مسلم وغيرها) -->
    <h2>📚 مكتبة الكتب والسنة</h2>
    <div class="card">
        <a href="https://waqfeya.net/book.php?bid=882" target="_blank"><button>تحميل صحيح مسلم (PDF)</button></a>
        <a href="https://github.com/learn-python/book" target="_blank"><button>تحميل كتاب بايثون الشامل</button></a>
        <a href="https://linux.org/book" target="_blank"><button>تحميل دليل اللينكس</button></a>
    </div>
</div>

<script>
    // كود لعبة السيارات
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let carX = 130;
    
    function draw() {
        ctx.fillStyle = '#222'; ctx.fillRect(0,0,300,400);
        ctx.fillStyle = 'red'; ctx.fillRect(carX, 330, 40, 60); // السيارة
        ctx.fillStyle = 'white'; ctx.fillRect(145, 0, 10, 50); // خط الطريق
        requestAnimationFrame(draw);
    }
    
    window.addEventListener('keydown', (e) => {
        if(e.key === 'ArrowLeft' && carX > 20) carX -= 20;
        if(e.key === 'ArrowRight' && carX < 240) carX += 20;
    });
    draw();

    // كود الخدمات
    function genPass() {
        document.getElementById('service-out').innerText = "الباسورد: " + Math.random().toString(36).substr(2);
    }
    function cleanCode() {
        document.getElementById('service-out').innerText = "جاري تنظيف الكود...";
    }
    function checkURL() {
        document.getElementById('service-out').innerText = "الرابط آمن.";
    }
</script>
</body>
</html>
